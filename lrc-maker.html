<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gõ nhịp lời bài hát → .lrc</title>
<style>
:root{--bg:#0b0d10;--card:#15181c;--line:#2a2f35;--fg:#f2f3f1;--mute:#9aa0a6;--accent:#f0dfae}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;padding:18px;padding-bottom:40px}
h1{font-size:1.25rem;margin:0 0 4px}
p.sub{color:var(--mute);font-size:.88rem;margin:0 0 18px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:6px}
input[type=file]{width:100%;color:var(--fg)}
textarea{width:100%;min-height:140px;background:#0f1114;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.92rem;line-height:1.5;resize:vertical;font-family:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{background:#20242a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9rem;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#1a1a1a;font-weight:600;border:none}
button:disabled{opacity:.4;cursor:default}
.tapbtn{width:100%;padding:22px;font-size:1.15rem;font-weight:700;border-radius:16px;background:linear-gradient(180deg,#2a3038,#181b1f);border:1px solid #3a4048}
.tapbtn:active{background:var(--accent);color:#1a1a1a}
.time{font-variant-numeric:tabular-nums;color:var(--accent);font-size:.95rem}
#lines{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.ln{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.88rem;align-items:center;cursor:pointer}
.ln:last-child{border-bottom:none}
.ln.done{color:var(--mute)}
.ln.cur{background:rgba(240,223,174,.12);color:#fff;font-weight:600}
.ln .t{width:64px;flex:none;color:var(--accent);font-variant-numeric:tabular-nums;font-size:.82rem}
.ln .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{color:var(--mute);font-size:.78rem;margin-top:6px}
#out{width:100%;min-height:160px;background:#0f1114;color:#cde;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace;white-space:pre}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2126;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<h1>Gõ nhịp lời bài hát → file .lrc</h1>
<p class="sub">1) Chọn file mp3 → 2) Dán lời bài hát, mỗi dòng xuống hàng → 3) Bấm Play, vừa nghe vừa bấm <b>Space</b> (hoặc nút TAP) đúng lúc câu đó bắt đầu → 4) Tải file .lrc về, đặt cạnh index.html.</p>

<div class="card">
  <label>1. Chọn file nhạc</label>
  <input type="file" id="file">
  <audio id="audio" controls style="width:100%;margin-top:10px;display:none"></audio>
  <div class="row" style="margin-top:10px">
    <label style="margin:0">Tốc độ:</label>
    <button data-rate="0.5">0.5x</button>
    <button data-rate="0.75">0.75x</button>
    <button data-rate="1" class="primary">1x</button>
  </div>
</div>

<div class="card">
  <label>2. Dán lời bài hát (mỗi dòng 1 câu)</label>
  <textarea id="lyrics" placeholder="Dòng 1&#10;Dòng 2&#10;Dòng 3..."></textarea>
  <button id="startTap" style="margin-top:10px">Bắt đầu gõ nhịp</button>
</div>

<div class="card" id="tapCard" style="display:none">
  <label>3. Vừa nghe vừa bấm đúng lúc câu đó cất lên</label>
  <div class="row" style="margin-bottom:10px">
    <span class="time" id="curTime">0:00.00</span>
    <button id="undo">↶ Undo dòng trước</button>
    <button id="restart">⟲ Làm lại từ đầu</button>
  </div>
  <button class="tapbtn" id="tapBtn">TAP (hoặc bấm phím Space)</button>
  <p class="hint">Bấm vào một dòng trong danh sách để tua lại và gõ lại riêng dòng đó.</p>
  <div id="lines" style="margin-top:10px"></div>
</div>

<div class="card" id="outCard" style="display:none">
  <label>4. File .lrc của bạn</label>
  <textarea id="out" readonly></textarea>
  <div class="row" style="margin-top:10px">
    <button class="primary" id="dl">⬇ Tải file .lrc</button>
    <button id="copy">Copy</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var audio=$("audio"), fileInput=$("file"), lyricsTA=$("lyrics");
  var lines=[], times=[], cur=0;

  fileInput.onchange=function(){
    var f=fileInput.files[0]; if(!f)return;
    audio.src=URL.createObjectURL(f); audio.style.display="block";
    audio.onerror=function(){ toast("File này trình duyệt không phát được, thử file khác xem sao"); };
  };
  document.querySelectorAll("[data-rate]").forEach(function(b){
    b.onclick=function(){ audio.playbackRate=parseFloat(b.dataset.rate);
      document.querySelectorAll("[data-rate]").forEach(x=>x.classList.remove("primary")); b.classList.add("primary"); };
  });

  function fmt(t){
    t=Math.max(0,t); var m=Math.floor(t/60), s=t-m*60;
    return m+":"+(s<10?"0":"")+s.toFixed(2);
  }
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1400)}

  $("startTap").onclick=function(){
    lines=lyricsTA.value.split(/\r?\n/).map(function(s){return s.trim()}).filter(function(s){return s.length});
    if(!lines.length){toast("Dán lời bài hát trước đã");return}
    if(!audio.src){toast("Chọn file nhạc trước đã");return}
    times=new Array(lines.length).fill(null); cur=0;
    $("tapCard").style.display="block"; $("outCard").style.display="none";
    renderLines(); audio.currentTime=0; audio.play().catch(function(){});
  };

  function renderLines(){
    var box=$("lines"); box.innerHTML="";
    lines.forEach(function(txt,i){
      var d=document.createElement("div");
      d.className="ln"+(i===cur?" cur":"")+(times[i]!=null?" done":"");
      d.innerHTML='<span class="t">'+(times[i]!=null?fmt(times[i]):"--:--")+'</span><span class="tx">'+txt.replace(/</g,"&lt;")+'</span>';
      d.onclick=function(){ cur=i; audio.currentTime=Math.max(0,(times[i]!=null?times[i]:0)-0.3); audio.play().catch(function(){}); renderLines(); };
      box.appendChild(d);
    });
    var curEl=box.children[cur]; if(curEl)curEl.scrollIntoView({block:"nearest"});
  }

  function tap(){
    if(!lines.length || cur>=lines.length)return;
    times[cur]=audio.currentTime; cur++;
    if(cur>=lines.length){ toast("Xong hết rồi! Tạo file bên dưới."); buildOutput(); audio.pause(); }
    renderLines();
  }
  $("tapBtn").onclick=tap;
  document.addEventListener("keydown",function(e){
    if(e.code==="Space" && $("tapCard").style.display!=="none"){ e.preventDefault(); tap(); }
  });
  $("undo").onclick=function(){
    if(cur>0){ cur--; times[cur]=null; renderLines(); }
  };
  $("restart").onclick=function(){
    times=new Array(lines.length).fill(null); cur=0; audio.currentTime=0; renderLines();
  };

  audio.addEventListener("timeupdate",function(){ $("curTime").textContent=fmt(audio.currentTime); });

  function pad(n){return (n<10?"0":"")+n}
  function buildOutput(){
    var out=lines.map(function(txt,i){
      var t=times[i]!=null?times[i]:0;
      var m=Math.floor(t/60), s=t-m*60;
      return "["+pad(m)+":"+(s<10?"0":"")+s.toFixed(2)+"]"+txt;
    }).join("\n");
    $("out").value=out; $("outCard").style.display="block";
    $("outCard").scrollIntoView({behavior:"smooth",block:"start"});
  }
  $("dl").onclick=function(){
    if(!$("out").value){toast("Gõ nhịp xong hết các dòng đã nhé");return}
    var blob=new Blob([$("out").value],{type:"text/plain"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="loi-bai-hat.lrc"; a.click();
  };
  $("copy").onclick=function(){
    navigator.clipboard.writeText($("out").value).then(function(){toast("Đã copy")},function(){toast("Copy thất bại, bạn tự bôi đen rồi copy")});
  };
})();
</script>
</body>
</html>
